[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-pluralism-protocol"
version = "5.4.0"
description = "APP — Adaptive Pluralism Protocol: an immune architecture of civilization facing the age of AGI"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["adaptive-pluralism", "replaceability", "civilisation", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Life",
]

[project.scripts]
app-sim = "adaptive_pluralism_protocol.civilization_simulator:main_cli"
app-node = "adaptive_pluralism_protocol.protocol_node:main_cli"

[project.optional-dependencies]
node = ["cryptography>=42"]

[tool.setuptools.packages.find]
where = ["src"]
